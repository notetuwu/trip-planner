name: Retry release

# Runs a failed release's failed jobs again (and then the release job, which adds their files), for the failures that are
# GitHub's own and that nothing inside a job can catch: no machine picked it up (mostly the Macs), or an action couldn't
# be downloaded. At most twice, so a real error in the code still ends as failed.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - run: gh run rerun "$RUN" --failed
        env:
          RUN: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
