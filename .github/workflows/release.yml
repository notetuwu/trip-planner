name: Release

# Push a version tag (e.g. `git tag v3.1.0 && git push origin v3.1.0`) to build the app for Windows, macOS and Linux
# and attach it to a GitHub release. Can also be started by hand from the Actions tab (builds without releasing).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest   # Apple Silicon
          - os: macos-13       # Intel
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use the tag as the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm test
      - run: npm run package
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" packaging\trip-planner.iss
      - uses: actions/upload-artifact@v4
        with:
          name: trip-planner-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.tar.gz
            release/*-setup.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Download:**
            - **Windows:** `…-windows-x64-setup.exe` (installer) or `…-windows-x64-portable.zip` (no install; unzip and run `Trip Planner.exe`)
            - **macOS:** `…-macos-arm64.zip` (Apple Silicon) or `…-macos-x64.zip` (Intel); unzip and move Trip Planner to Applications
            - **Linux:** `…-linux-x64.tar.gz`; unpack and run `trip-planner`

            The app isn't code-signed yet. Windows may show "Windows protected your PC": click **More info → Run anyway**. On macOS, right-click the app → **Open** the first time (or allow it under System Settings → Privacy & Security).

            For planning you need [Claude Code](https://claude.com/claude-code) (logged in), a local model server such as [Ollama](https://ollama.com), or an API key (🔑 in the app).
