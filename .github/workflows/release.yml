name: Release

# Push a version tag (e.g. `git tag v3.1.0 && git push origin v3.1.0`) to build the app for Windows, macOS and Linux
# and attach it to a GitHub release. Can also be started by hand from the Actions tab (builds without releasing).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest   # Apple Silicon
          - os: macos-15-intel # Intel
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use the tag as the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm test
      - run: npm run package
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" packaging\trip-planner.iss
      - uses: actions/upload-artifact@v4
        with:
          name: trip-planner-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.tar.gz
            release/*-setup.exe

  release:
    needs: build
    # Publish what was built even if one system's build failed (its files are just missing from the release).
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      # The history, for "What's new" (the commit messages since the previous version).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: node scripts/release-notes.mjs "$TAG" > notes.md
        env:
          TAG: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
