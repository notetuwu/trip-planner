name: Release notes

# Rewrites release notes ("What's new" from the commit messages, then how to download). Run it from the Actions tab
# (Run workflow): leave the tag empty to fill in every release that doesn't have "What's new" yet, or give one tag
# (e.g. v3.5.0) to rewrite just that one. Each release also does this for older ones automatically.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v3.5.0 (empty: every release without \"What's new\")"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/backfill-release-notes.sh "$TAG"
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
